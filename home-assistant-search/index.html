<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HA Startpage</title>
    <link class="favicon" rel="shortcut icon" type="image/x-icon" href="https://cdn.startpage.com/sp/cdn/favicons/favicon-gradient.ico"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', Arial, sans-serif;
        }

        body {
            background-color: #0f1219;
            color: #cdd2dd;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .search-container {
            width: 100%;
            max-width: 580px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            width: 180px;
            height: auto;
            margin-bottom: 16px;
        }

        .tagline {
            font-size: 15px;
            color: #a0a6b8;
            margin-bottom: 28px;
        }

        .search-form {
            width: 100%;
            display: flex;
            align-items: center;
            background-color: #202634;
            border: 1px solid #2e364a;
            border-radius: 28px;
            padding: 6px 16px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-form:focus-within {
            border-color: #6573ff;
            box-shadow: 0 0 0 2px rgba(101, 115, 255, 0.2);
        }

        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 16px;
            padding: 10px 8px;
        }

        .search-input::placeholder {
            color: #68728a;
        }

        .search-button {
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            color: #9aa6f0;
        }

        .search-button:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <main class="search-container">
        <img class="logo" src="https://cdn.startpage.com/sp/cdn/images/home/startpage-logo-dark.svg" alt="Startpage">

        <p class="tagline">The world's most private search engine for HA.</p>

        <form id="searchForm" class="search-form">
            <input type="text" id="searchInput" class="search-input" placeholder="Search privately..." autofocus />
            <button type="submit" class="search-button" aria-label="Search">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>
        </form>
    </main>

    <script>
        document.getElementById('searchForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const query = document.getElementById('searchInput').value.trim();
            if (query) {
                window.top.location.href = 'https://www.startpage.com/sp/search?query=' + encodeURIComponent(query);
            }
        });
    </script>

</body>
</html>
